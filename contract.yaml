apiVersion: v3.1.0
kind: DataContract

# ──────────────────────────────────────────────
# Fundamentals
# ──────────────────────────────────────────────
id: 7e6b-2691-7862
name: keylabs_game_contract
version: 0.1.0
status: draft
domain: game
dataProduct: press_typing_game
tenant: keylabs

tags: [game, auth, leaderboard]

description:
  purpose: >
    Defines the data shapes exchanged between the Next.js client,
    server actions, and the PostgreSQL database for the typing game.
  limitations: >
    submitGameData server action is currently stubbed (commented out).
    Guest scores are stored in localStorage only; no server persistence yet.
  usage: >
    Reference during migration. Update status to "active" once
    the game_result table is wired and submitGameData is live.


# ──────────────────────────────────────────────
# Schema
# ──────────────────────────────────────────────
schema:

  # ── DB: user ──────────────────────────────
  - id: tbl_user
    name: user
    logicalType: object
    physicalType: table
    physicalName: user
    description: >
      Core identity record managed by better-auth.
      Created on first sign-up; drives session + account relations.
    tags: [auth]
    properties:
      - id: user_id
        name: id
        logicalType: string
        physicalType: text
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        description: Opaque primary key generated by better-auth.

      - id: user_name
        name: name
        logicalType: string
        physicalType: text
        required: true
        description: Display name. Copied into game result submissions.

      - id: user_email
        name: email
        logicalType: string
        physicalType: text
        required: true
        unique: true
        classification: restricted
        logicalTypeOptions:
          format: email
        description: Unique, verified email address.

      - id: user_email_verified
        name: emailVerified
        logicalType: boolean
        physicalType: boolean
        required: true
        description: Set to true after email verification flow completes.
        examples: [false, true]

      - id: user_image
        name: image
        logicalType: string
        physicalType: text
        required: false
        description: Avatar URL. Nullable.

      - id: user_created_at
        name: createdAt
        logicalType: timestamp
        physicalType: timestamp
        required: true
        logicalTypeOptions:
          format: "yyyy-MM-ddTHH:mm:ssZ"
          defaultTimezone: UTC

      - id: user_updated_at
        name: updatedAt
        logicalType: timestamp
        physicalType: timestamp
        required: true
        logicalTypeOptions:
          format: "yyyy-MM-ddTHH:mm:ssZ"
          defaultTimezone: UTC
        description: Auto-updated on every write via $onUpdate.


  # ── DB: session ───────────────────────────
  - id: tbl_session
    name: session
    logicalType: object
    physicalType: table
    physicalName: session
    description: Active auth sessions. Indexed on userId.
    tags: [auth]
    properties:
      - id: session_id
        name: id
        logicalType: string
        physicalType: text
        primaryKey: true
        primaryKeyPosition: 1
        required: true

      - id: session_user_id
        name: userId
        logicalType: string
        physicalType: text
        required: true
        description: FK → user.id. Cascade delete. Indexed (session_userId_idx).

      - id: session_token
        name: token
        logicalType: string
        physicalType: text
        required: true
        unique: true
        classification: restricted

      - id: session_expires_at
        name: expiresAt
        logicalType: timestamp
        physicalType: timestamp
        required: true

      - id: session_ip
        name: ipAddress
        logicalType: string
        physicalType: text
        required: false
        classification: restricted

      - id: session_ua
        name: userAgent
        logicalType: string
        physicalType: text
        required: false


  # ── DB: account ───────────────────────────
  - id: tbl_account
    name: account
    logicalType: object
    physicalType: table
    physicalName: account
    description: >
      OAuth and credential provider links per user.
      A single user may have multiple accounts (one per provider).
    tags: [auth]
    properties:
      - id: account_id
        name: id
        logicalType: string
        physicalType: text
        primaryKey: true
        primaryKeyPosition: 1
        required: true

      - id: account_user_id
        name: userId
        logicalType: string
        physicalType: text
        required: true
        description: FK → user.id. Cascade delete. Indexed (account_userId_idx).

      - id: account_account_id
        name: accountId
        logicalType: string
        physicalType: text
        required: true
        description: The provider's own identifier for this user.

      - id: account_provider_id
        name: providerId
        logicalType: string
        physicalType: text
        required: true
        description: Provider slug, e.g. "google", "github", "credential".
        examples: [google, github, credential]

      - id: account_access_token
        name: accessToken
        logicalType: string
        physicalType: text
        required: false
        classification: restricted

      - id: account_refresh_token
        name: refreshToken
        logicalType: string
        physicalType: text
        required: false
        classification: restricted

      - id: account_password
        name: password
        logicalType: string
        physicalType: text
        required: false
        classification: restricted
        description: Hashed password. Only present for credential-based accounts.


  # ── DB: verification ──────────────────────
  - id: tbl_verification
    name: verification
    logicalType: object
    physicalType: table
    physicalName: verification
    description: Short-lived tokens for email verification and magic links.
    tags: [auth]
    properties:
      - id: verif_id
        name: id
        logicalType: string
        physicalType: text
        primaryKey: true
        primaryKeyPosition: 1
        required: true

      - id: verif_identifier
        name: identifier
        logicalType: string
        physicalType: text
        required: true
        description: >
          The target to verify, typically an email address.
          Indexed (verification_identifier_idx).

      - id: verif_value
        name: value
        logicalType: string
        physicalType: text
        required: true
        classification: restricted

      - id: verif_expires_at
        name: expiresAt
        logicalType: timestamp
        physicalType: timestamp
        required: true


  # ── DB: game_result (TODO) ────────────────
  - id: tbl_game_result
    name: game_result
    logicalType: object
    physicalType: table
    physicalName: game_result
    description: >
      Persisted outcome of a completed game session.
      Table does not yet exist — wire submitGameData() to create/insert.
    tags: [game, leaderboard]
    customProperties:
      implementationStatus: pending
    properties:
      - id: result_id
        name: id
        logicalType: string
        physicalType: text
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        description: Generated UUID.

      - id: result_user_id
        name: userId
        logicalType: string
        physicalType: text
        required: false
        description: FK → user.id. Null for guest submissions.

      - id: result_user_name
        name: userName
        logicalType: string
        physicalType: text
        required: true
        description: Snapshot of user.name at submission time.

      - id: result_mode
        name: mode
        logicalType: string
        physicalType: text
        required: true
        description: Game mode played.
        examples: [characters, time]

      - id: result_language
        name: language
        logicalType: string
        physicalType: text
        required: true
        examples: [english_5k, english, french]

      - id: result_total_time
        name: totalTime
        logicalType: number
        physicalType: float
        required: true
        description: Elapsed seconds for the session.

      - id: result_total_char
        name: totalChar
        logicalType: integer
        physicalType: int
        required: true
        description: Target character count configured for the session.

      - id: result_total_click
        name: totalClick
        logicalType: integer
        physicalType: int
        required: true
        description: Total keystrokes / clicks made by the player.

      - id: result_total_hit
        name: totalHit
        logicalType: integer
        physicalType: int
        required: true
        description: Correct hits (used as numerator for accuracy and LPM).

      - id: result_target_size
        name: targetSize
        logicalType: integer
        physicalType: int
        required: true
        description: Bubble target size in pixels at time of play.

      - id: result_wpm
        name: wpm
        logicalType: number
        physicalType: float
        required: true
        description: Accuracy-adjusted words per minute. Formula — rawWpm × (accuracy / 100).

      - id: result_raw_wpm
        name: rawWpm
        logicalType: number
        physicalType: float
        required: true
        description: Unadjusted WPM. Formula — (totalHit / 5) × (60 / totalTime).

      - id: result_lpm
        name: lpm
        logicalType: number
        physicalType: float
        required: true
        description: Accuracy-adjusted letters per minute.

      - id: result_raw_lpm
        name: rawLpm
        logicalType: number
        physicalType: float
        required: true
        description: Unadjusted LPM. Formula — totalHit × (60 / totalTime).

      - id: result_accuracy
        name: accuracy
        logicalType: number
        physicalType: float
        required: true
        description: >
          Hit accuracy as a percentage, two decimal places.
          Formula — (totalHit / totalClick) × 100.
        logicalTypeOptions:
          minimum: 0
          maximum: 100

      - id: result_created_at
        name: createdAt
        logicalType: timestamp
        physicalType: timestamp
        required: true
        logicalTypeOptions:
          format: "yyyy-MM-ddTHH:mm:ssZ"
          defaultTimezone: UTC


  # ── Client type: wordSet ──────────────────
  - id: type_word_set
    name: wordSet
    logicalType: object
    physicalType: typescript-type
    description: Word list returned by the generate-word service and cached under QUERY_KEY.STATIC_WORDS.
    tags: [game, client]
    properties:
      - id: word_set_name
        name: name
        logicalType: string
        required: true
        description: Language identifier matching the language slug in usePreConfig.
        examples: [english_5k, french, english]

      - id: word_set_words
        name: words
        logicalType: array
        required: true
        description: Ordered list of words for this session.
        items:
          logicalType: string


  # ── Client store: PreGameConfig ───────────
  - id: store_pre_game_config
    name: PreGameConfig
    logicalType: object
    physicalType: zustand-store
    description: >
      Pre-game settings selected by the player before starting a session.
      Drives InitializeGame() and the word fetch query.
    tags: [game, client]
    customProperties:
      knownBug: >
        resetConfig() copies current state instead of restoring initial defaults.
        Store the initial config in a const and reset to that.
    properties:
      - id: cfg_mode
        name: mode
        logicalType: string
        required: true
        description: Game mode.
        examples: [characters, time]

      - id: cfg_language
        name: language
        logicalType: string
        required: true
        description: Word list slug. Passed to useGenerateWords().
        examples: [english_5k, english, french]

      - id: cfg_time
        name: time
        logicalType: integer
        required: true
        description: Session time limit in seconds. 0 = untimed.
        logicalTypeOptions:
          minimum: 0

      - id: cfg_length_char
        name: lengthChar
        logicalType: integer
        required: true
        description: Target character count for the session.
        logicalTypeOptions:
          minimum: 1

      - id: cfg_target_size
        name: targetSize
        logicalType: integer
        required: true
        description: Bubble target diameter in pixels. Default 96 (16 × 6).
        logicalTypeOptions:
          minimum: 1

      - id: cfg_is_custom
        name: isCustom
        logicalType: boolean
        required: true
        description: True when the player has provided a custom word list.


  # ── Client storage: localStorage gameData ─
  - id: storage_game_data
    name: gameData
    logicalType: array
    physicalType: localStorage-key
    physicalName: gameData
    description: >
      Guest fallback. Stores up to 10 GameData entries locally.
      Oldest entry is evicted (shift) when the array reaches 10 items.
      Only written when the user prop passed to ClientGamePage is undefined.
    tags: [game, client]
    customProperties:
      maxItems: 10
      evictionPolicy: shift-oldest
      syncTodo: Consider syncing guest results to server on sign-in.
    items:
      logicalType: object
      properties:
        - id: gd_mode
          name: mode
          logicalType: string
          required: true

        - id: gd_language
          name: language
          logicalType: string
          required: true

        - id: gd_total_time
          name: totalTime
          logicalType: number
          required: true

        - id: gd_total_char
          name: totalChar
          logicalType: integer
          required: true

        - id: gd_total_click
          name: totalClick
          logicalType: integer
          required: true

        - id: gd_total_hit
          name: totalHit
          logicalType: integer
          required: true

        - id: gd_target_size
          name: targetSize
          logicalType: integer
          required: true

        - id: gd_wpm
          name: wpm
          logicalType: number
          required: true

        - id: gd_raw_wpm
          name: rawWpm
          logicalType: number
          required: true

        - id: gd_lpm
          name: lpm
          logicalType: number
          required: true

        - id: gd_raw_lpm
          name: rawLpm
          logicalType: number
          required: true

        - id: gd_accuracy
          name: accuracy
          logicalType: number
          required: true


